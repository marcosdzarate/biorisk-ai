
abstract=BiodivRisk-Onto is an OWL 2 DL ontology for representing equivalence, subsumption, complementarity and incommensurability relations among TNFD, CSRD/ESRS E4, SBTN and GRI 101. Version 0.3.0 adds explicit information-loss records, ordered sector priorities, biome links and instances grounded in the Santander Peru and CEBDS Brazil assessments.
