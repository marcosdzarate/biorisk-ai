introduction=The ontology supports machine-processable comparison of biodiversity-risk disclosure frameworks while preserving distinctions that cannot be translated without information loss. It was developed following the LOT methodology and validated through 15 competency questions. The natural-language questions and 16 executable SPARQL 1.1 query blocks are available in the [project repository](https://github.com/marcosdzarate/biorisk-ai/blob/main/ontology/competency-questions.md).
